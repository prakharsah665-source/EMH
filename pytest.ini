[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
# JUnit XML on every run (built-in, no plugin needed). The
# self-contained pytest-html report is produced by
# scripts/run_all_tests.py alongside screenshots/traces.
addopts = --junitxml=reports/junit_results.xml -o junit_logging=all
markers =
    ai_evaluation: LLM-judged interview quality evaluation tests
    security_live: opt-in live DeepTeam red-team (needs the py3.13 security venv and EMH_LIVE_REDTEAM=1)